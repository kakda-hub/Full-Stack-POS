version: '3.9'

services:
  # ─── Local MySQL (available for local dev/testing; app connects to TiDB Cloud externally)
  mysql:
    image: mysql:8.4
    container_name: pos_mysql_local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pos_db
      MYSQL_USER: pos_user
      MYSQL_PASSWORD: pos_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pos_network

  # ─── NestJS API (connects to TiDB Cloud externally) ──────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: pos_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      # TiDB Cloud connection (override .env if needed via shell)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-4000}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    ports:
      - '3000:3000'
    networks:
      - pos_network

volumes:
  mysql_data:

networks:
  pos_network:
    driver: bridge
