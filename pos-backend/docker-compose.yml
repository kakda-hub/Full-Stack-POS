version: '3.9'

services:
  # ─── Local MySQL (development branch only — production uses TiDB Cloud)
  mysql:
    image: mysql:8.4
    container_name: pos_mysql_local
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pos_db
      MYSQL_USER: pos_user
      MYSQL_PASSWORD: pos_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pos_network

  # ─── NestJS API (connects to local MySQL via Docker network) ─────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: pos_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      # NOTE: DB_HOST / DB_PORT / DB_SSL intentionally come ONLY from env_file —
      # do NOT add environment: overrides for them, or a plain `docker compose up`
      # would inject the local defaults (mysql:3306/false) on top of whatever DB
      # credentials the .env contains (e.g. TiDB Cloud), breaking the connection.
      # For local MySQL dev, set DB_HOST=mysql DB_PORT=3306 DB_SSL=false in the .env.
    ports:
      - '3000:3000'
    networks:
      - pos_network

volumes:
  mysql_data:

networks:
  pos_network:
    driver: bridge
