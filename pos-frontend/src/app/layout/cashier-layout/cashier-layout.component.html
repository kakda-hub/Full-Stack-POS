<div class="cashier-layout">
  <!-- Top Nav -->
  <header class="cashier-header">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-200 dark:shadow-indigo-900/40">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
        </svg>
      </div>
      <div>
        <h1 class="text-lg font-extrabold tracking-tight text-slate-800 dark:text-white">
          Mini Mart
        </h1>
      </div>
      @if (cart.itemCount() > 0) {
        <span class="cart-count-badge" [@counterAnimation]="cart.itemCount()">{{ cart.itemCount() }}</span>
      }
    </div>
    <div class="flex items-center gap-3">
      <!-- Dark Mode Toggle -- Segmented control -->
      <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-lg">
        <button
          (click)="theme.setTheme('light')"
          [class.bg-white]="!theme.isDark()"
          [class.shadow-sm]="!theme.isDark()"
          [class.text-indigo-600]="!theme.isDark()"
          [class.text-slate-400]="theme.isDark()"
          [class.hover\:text-indigo-600]="theme.isDark()"
          class="p-1.5 rounded transition-all"
          [title]="theme.isDark() ? 'Switch to Light' : 'Light mode'"
          type="button"
        >
          <svg [@themeRotate]="theme.currentTheme()" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
          </svg>
        </button>
        <button
          (click)="theme.setTheme('dark')"
          [class.bg-white]="theme.isDark()"
          [class.shadow-sm]="theme.isDark()"
          [class.text-indigo-600]="theme.isDark()"
          [class.text-slate-400]="!theme.isDark()"
          [class.hover\:text-indigo-600]="!theme.isDark()"
          class="p-1.5 rounded transition-all"
          [title]="theme.isDark() ? 'Dark mode' : 'Switch to Dark'"
          type="button"
        >
          <svg [@themeRotate]="theme.currentTheme()" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
          </svg>
        </button>
      </div>

      <!-- Language Toggle -->
      <button (click)="langService.toggle()" class="lang-toggle">
        <span>{{ langService.currentLang() === 'en' ? '🇰🇭 ខ្មែរ' : '🇬🇧 EN' }}</span>
      </button>

      <!-- User Area -->
      <div class="flex items-center gap-3 pl-3 border-l border-slate-200 dark:border-slate-700">
        <div class="text-right hidden sm:block">
          <p class="text-xs font-bold text-slate-700 dark:text-slate-300">{{ auth.currentUser()?.name || 'Cashier' }}</p>
          <p class="text-[10px] text-emerald-500 dark:text-emerald-400 font-medium flex items-center gap-1 justify-end">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
            Online
          </p>
        </div>
        <app-ui-avatar
          [imageUrl]="auth.currentUser()?.avatarUrl"
          [name]="auth.currentUser()?.name"
          size="sm"
          [ring]="true"
          ringColor="ring-white dark:ring-slate-700 shadow-sm"
          status="online"
          [clickable]="true"
          (avatarClick)="openAvatarDialog()"
        ></app-ui-avatar>
      </div>

      <button (click)="auth.logout()" class="logout-btn" title="Logout">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 overflow-hidden">
    <router-outlet></router-outlet>
  </main>
</div>
