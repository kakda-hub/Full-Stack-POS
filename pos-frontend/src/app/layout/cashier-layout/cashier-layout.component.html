<div class="cashier-layout">
  <!-- Top Nav -->
  <header class="cashier-header">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
        <img class="w-full h-full object-cover" src="https://img.freepik.com/premium-vector/vector-design-pos-terminal-icon-style_1134108-160792.jpg?semt=ais_hybrid&w=740&q=80" alt="" />
      </div>
      <span class="brand-text">
        Mini Mart
        @if (cart.itemCount() > 0) {
          <span class="cart-count-badge" [@counterAnimation]="cart.itemCount()">{{ cart.itemCount() }}</span>
        }
      </span>
    </div>
    <div class="flex items-center gap-3">
      <!-- Dark Mode Toggle -->
      <button
        (click)="theme.toggle()"
        class="theme-toggle-btn"
        [title]="theme.isDark() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
        type="button"
        aria-label="Toggle theme"
      >
        <svg
          *ngIf="theme.isDark()"
          class="w-4 h-4 text-amber-400"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="5" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
        <svg
          *ngIf="!theme.isDark()"
          class="w-4 h-4 text-slate-600"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          stroke-width="2"
        >
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>

      <button
        (click)="langService.toggle()"
        class="lang-toggle"
      >
        <span>{{ langService.currentLang() === 'en' ? '🇰🇭 ខ្មែរ' : '🇬🇧 EN' }}</span>
      </button>

      <div class="user-info-text">
        <div class="w-8 h-8 rounded-full flex items-center justify-center overflow-hidden avatar-ring">
          @if (auth.currentUser()?.avatarUrl && !avatarError()) {
            <img class="w-full h-full object-cover" [src]="auth.currentUser()?.avatarUrl" alt="" (error)="onAvatarError()" />
          } @else {
            <div
              class="w-full h-full flex items-center justify-center font-bold text-xs avatar-fallback"
              [attr.aria-label]="(auth.currentUser()?.name || 'User') + ' avatar'"
            >
              {{ (auth.currentUser()?.name || 'U').charAt(0).toUpperCase() }}
            </div>
          }
        </div>
        <span class="hidden sm:inline font-medium">{{ auth.currentUser()?.name }}</span>
      </div>

      <button (click)="auth.logout()" class="logout-btn" title="Logout">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 overflow-hidden">
    <router-outlet></router-outlet>
  </main>
</div>
