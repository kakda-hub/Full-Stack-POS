<button
  type="button"
  class="sort-btn"
  [class.sort-btn--active]="isActive"
  (click)="onClick()"
  [attr.title]="
    isActive
      ? activeDir === 'asc'
        ? 'Sorted ascending'
        : 'Sorted descending'
      : 'Sort by this column'
  "
>
  <span class="sort-label">{{ displayLabel }}</span>

  <!-- Active column: solid up/down chevron -->
  <svg
    *ngIf="isActive"
    class="sort-icon"
    fill="none"
    stroke="currentColor"
    viewBox="0 0 24 24"
    aria-hidden="true"
  >
    <path
      *ngIf="activeDir === 'asc'"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2.5"
      d="M5 15l7-7 7 7"
    />
    <path
      *ngIf="activeDir === 'desc'"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2.5"
      d="M19 9l-7 7-7-7"
    />
  </svg>

  <!-- Inactive column: faint sort affordance -->
  <svg
    *ngIf="!isActive"
    class="sort-icon sort-icon--idle"
    fill="none"
    stroke="currentColor"
    viewBox="0 0 24 24"
    aria-hidden="true"
  >
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l4-4 4 4M8 15l4 4 4-4" />
  </svg>
</button>
