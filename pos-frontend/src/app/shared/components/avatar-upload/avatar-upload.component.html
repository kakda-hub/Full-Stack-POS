<div
  class="avu-wrapper group relative flex flex-col items-center gap-4"
  [class.is-dragging]="isDragging()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  <!-- Avatar Container -->
  <div
    class="avu-avatar relative cursor-pointer transition-all duration-300 ease-out hover:scale-[1.02] active:scale-95"
    (mouseenter)="isHovering.set(true)"
    (mouseleave)="isHovering.set(false)"
    (click)="fileInput.click()"
  >
    <!-- The Actual Avatar Component -->
    <app-ui-avatar
      [imageUrl]="localPreview() || imageUrl()"
      [name]="userName()"
      size="xl"
      [ring]="true"
      [ringColor]="isDragging() ? 'ring-indigo-500' : 'ring-slate-200 dark:ring-slate-800'"
      class="transition-all duration-300"
      [class.opacity-50]="isDragging()"
    ></app-ui-avatar>

    <!-- Camera / Action Overlay -->
    <div
      class="avu-overlay absolute inset-0 z-10 flex flex-col items-center justify-center rounded-full bg-black/40 text-white opacity-0 backdrop-blur-[2px] transition-opacity duration-200"
      [class.opacity-100]="isHovering() || isDragging()"
    >
      <svg class="h-8 w-8 mb-1" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0Z" />
      </svg>
      <span class="text-[10px] font-bold uppercase tracking-wider">
        {{ (imageUrl() || localPreview()) ? 'Change' : 'Upload' }}
      </span>
    </div>

    <!-- Drag Active State (Ripples) -->
    @if (isDragging()) {
      <div class="avu-drag-indicator absolute inset-0 z-20 pointer-events-none">
        <div class="avu-ripple"></div>
        <div class="avu-ripple ripple-2"></div>
      </div>
    }

    <!-- Remove Button -->
    @if ((imageUrl() || localPreview()) && isHovering() && !isDragging()) {
      <button
        type="button"
        (click)="onRemove($event)"
        class="absolute -right-1 -top-1 z-30 flex h-7 w-7 items-center justify-center rounded-full border-2 border-white bg-red-500 text-white shadow-lg transition-transform hover:scale-110 active:scale-90 dark:border-slate-900"
      >
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    }
  </div>

  <!-- Bottom Hint -->
  <div class="text-center">
    @if (isDragging()) {
      <p class="text-sm font-semibold text-indigo-600 animate-pulse">Drop to upload</p>
    } @else {
      <p class="text-xs text-slate-400 dark:text-slate-500">
        JPG, PNG or GIF. Max 5MB.
      </p>
    }
  </div>

  <!-- Hidden Input -->
  <input
    #fileInput
    type="file"
    accept="image/*"
    class="hidden"
    (change)="onFileSelected($event)"
  />
</div>
