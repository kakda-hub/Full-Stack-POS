<div class="pag-bar">
  <!-- Items per page dropdown -->
  <div class="pag-size">
    <span class="pag-label">{{ 'pagination.items_per_page' | translate }}:</span>
    <div class="relative">
      <button
        type="button"
        class="pag-size-btn"
        (click)="toggleDropdown()"
        [attr.aria-expanded]="isDropdownOpen"
        aria-haspopup="listbox"
        [attr.aria-label]="'pagination.items_per_page' | translate"
      >
        <span class="pag-size-btn-value">{{ pageSize }}</span>
        <svg
          class="pag-size-btn-icon"
          [class.pag-size-btn-icon--open]="isDropdownOpen"
          fill="none" stroke="currentColor" viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
      </button>

      <!-- Dropdown Menu (opens upward so it is never clipped by the table) -->
      <div
        *ngIf="isDropdownOpen"
        class="pag-dropdown"
        role="listbox"
        [attr.aria-label]="'pagination.items_per_page' | translate"
      >
        <button
          *ngFor="let option of pageSizeOptions"
          type="button"
          role="option"
          class="pag-dropdown-item"
          [class.pag-dropdown-item--active]="option === pageSize"
          [attr.aria-selected]="option === pageSize"
          (click)="onPageSizeChange(option)"
        >
          <span>{{ option }}</span>
          <svg
            *ngIf="option === pageSize"
            class="pag-dropdown-check"
            fill="none" stroke="currentColor" viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Range display -->
  <div class="pag-range" aria-live="polite">
    <span class="pag-range-value">{{ startIndex }}</span>
    <span class="pag-range-sep">–</span>
    <span class="pag-range-value">{{ endIndex }}</span>
    <span class="pag-range-sep">{{ 'pagination.of' | translate }}</span>
    <span class="pag-range-value">{{ totalItems }}</span>
  </div>

  <!-- Navigation -->
  <nav class="pag-nav" [attr.aria-label]="'pagination.navigation' | translate">
    <button
      type="button"
      class="pag-nav-btn"
      (click)="onPageChange(currentPage - 1)"
      [disabled]="currentPage === 1"
      [attr.aria-label]="'button.previous' | translate"
    >
      <svg class="pag-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
      </svg>
    </button>

    <div class="pag-pages">
      <ng-container *ngFor="let page of pages">
        <span *ngIf="page === '...'" class="pag-ellipsis" aria-hidden="true">…</span>
        <button
          *ngIf="page !== '...'"
          type="button"
          class="pag-page-btn"
          [class.pag-page-btn--active]="page === currentPage"
          (click)="onPageChange(page)"
          [attr.aria-current]="page === currentPage ? 'page' : null"
          [attr.aria-label]="'pagination.page' | translate: { page: page }"
        >
          {{ page }}
        </button>
      </ng-container>
    </div>

    <button
      type="button"
      class="pag-nav-btn"
      (click)="onPageChange(currentPage + 1)"
      [disabled]="currentPage === totalPages"
      [attr.aria-label]="'button.next' | translate"
    >
      <svg class="pag-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
      </svg>
    </button>
  </nav>
</div>
