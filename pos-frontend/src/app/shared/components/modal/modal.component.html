<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div @backdropAnimation class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" (click)="closeOnBackdrop && close.emit()"></div>
  <div @modalAnimation [class]="'relative bg-white rounded-2xl shadow-2xl w-full ' + sizeClass + ' max-h-[90vh] overflow-y-auto'">
    <div *ngIf="title" class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
      <h2 class="text-lg font-bold text-slate-800">{{ title }}</h2>
      <button *ngIf="showClose" (click)="close.emit()" class="p-1.5 rounded-lg hover:bg-slate-100 transition-colors text-slate-400 hover:text-slate-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="p-6">
      <ng-content></ng-content>
    </div>
  </div>
</div>
