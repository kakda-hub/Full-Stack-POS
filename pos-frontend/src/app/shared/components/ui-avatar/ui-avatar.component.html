<div
  class="avatar-wrapper"
  [class.clickable]="clickable"
  [class]="getSizeClasses()"
  [attr.role]="clickable ? 'button' : null"
  [attr.tabindex]="clickable ? 0 : null"
  (click)="clickable && avatarClick.emit()"
  (keydown.enter)="clickable && avatarClick.emit()"
  (keydown.space)="clickable && avatarClick.emit(); $event.preventDefault()"
>
  <!-- Shimmer skeleton while image loads (only when imageUrl is set) -->
  @if (imageUrl && !avatarError() && !imageLoaded()) {
    <div
      class="avatar-shimmer w-full h-full rounded-full"
      [class.ring-2]="ring"
      [class]="ring ? ringColor : ''"
    >
      <div class="shimmer-slide"></div>
    </div>
  }

  <!-- Image avatar -->
  @if (imageUrl && !avatarError()) {
    <img
      [src]="imageUrl"
      alt="{{ name || 'User' }} avatar"
      class="avatar-img w-full h-full rounded-full object-cover"
      [class.ring-2]="ring"
      [class]="ring ? ringColor : ''"
      [class.avatar-img-loaded]="imageLoaded()"
      [class.avatar-img-loading]="!imageLoaded()"
      (load)="onImageLoad()"
      (error)="onAvatarError()"
      loading="lazy"
    />
  }

  <!-- Default image fallback (shown when no imageUrl or on image error) -->
  @if (!imageUrl || avatarError()) {
    <div
      class="avatar-fallback w-full h-full rounded-full flex items-center justify-center overflow-hidden"
      [class.ring-2]="ring"
      [ngClass]="[ring ? ringColor : '', 'bg-slate-100 dark:bg-slate-800']"
      [attr.aria-label]="(name || 'User') + ' avatar'"
    >
      @if (defaultImage) {
        <img
          [src]="defaultImage"
          alt="{{ name || 'User' }} avatar"
          class="w-full h-full object-cover"
        />
      } @else {
        <!-- Inline SVG user silhouette placeholder -->
        <img
          src="assets/icons/user-icon.svg"
          alt="{{ name || 'User' }} avatar"
          class="w-1/2 h-1/2 text-slate-400 dark:text-slate-500 select-none"
        />
      }
    </div>
  }

  <!-- Status indicator dot -->
  @if (status) {
    <span
      class="avatar-status-dot"
      [class]="statusDotColor"
      [attr.aria-label]="status"
      [title]="status"
    ></span>
  }

  <!-- Hover overlay glow effect -->
  <div class="avatar-hover-glow rounded-full"></div>
</div>
