<div class="relative" [ngClass]="size">
  @if (imageUrl && !avatarError) {
    <img
      [src]="imageUrl"
      alt="Profile"
      class="w-full h-full rounded-full object-cover transition-all duration-300"
      [class.ring-2]="ring"
      [class.group-hover:ring-4]="ring"
      [class]="ring ? ringColor : ''"
      (error)="onAvatarError()"
    />
  } @else {
    <div
      class="w-full h-full rounded-full bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center transition-all duration-300"
      [class.ring-2]="ring"
      [class.group-hover:ring-4]="ring"
      [class]="ring ? ringColor : ''"
      [attr.aria-label]="(name || 'User') + ' avatar'"
    >
      <span class="font-bold text-white select-none" [ngClass]="textSize">{{ initial }}</span>
    </div>
  }
</div>
