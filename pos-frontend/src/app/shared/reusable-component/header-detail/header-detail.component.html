<header class="dialog-header flex justify-between items-center py-2 px-4 border-b border-slate-200 ">
  <h3 class="text-base font-bold text-slate-800 m-0">{{ id ? 'កែប្រែ' : 'បង្កើត' }}</h3>
  <button mat-icon-button mat-dialog-close class="text-slate-400 hover:text-rose-500 transition-colors">
    <mat-icon class="text-rose-500">close</mat-icon>
  </button>
</header>
