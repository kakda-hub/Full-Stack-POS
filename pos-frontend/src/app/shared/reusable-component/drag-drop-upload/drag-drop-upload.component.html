<div class="upload-wrapper">
  <label
    [class.text-slate-300]="theme.isDark()"
    [class.text-slate-700]="!theme.isDark()"
    class="block text-sm font-semibold mb-1.5"
    >{{ lang.currentLang() === 'km' ? labelKm : label }}</label
  >
  <div
    class="flex items-center justify-center w-full border-2 border-dashed rounded-xl transition-all overflow-hidden relative min-h-[8rem]"
    [class.bg-slate-700]="theme.isDark()"
    [class.border-slate-600]="theme.isDark()"
    [class.border-indigo-500]="isDragging() && theme.isDark()"
    [class.bg-slate-50]="!theme.isDark()"
    [class.border-slate-300]="!theme.isDark()"
    [class.border-indigo-400]="isDragging() && !theme.isDark()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <label class="flex flex-col items-center justify-center w-full h-full cursor-pointer min-h-[8rem]">
      <div *ngIf="value; else noImage" class="absolute inset-0">
        <img [src]="value" class="w-full h-full object-contain bg-black/5" />
        <div
          class="absolute inset-0 bg-black/40 flex flex-col items-center justify-center opacity-0 hover:opacity-100 transition-opacity"
        >
          <mat-icon class="text-white mb-1">upload</mat-icon>
          <span class="text-white text-xs font-semibold">{{
            lang.currentLang() === 'km' ? 'ប្តូររូបភាព' : 'Change Image'
          }}</span>
          
          <button 
            type="button" 
            (click)="removeImage($event)"
            class="mt-2 p-1 bg-rose-500 text-white rounded-full hover:bg-rose-600 transition-colors"
          >
            <mat-icon style="font-size: 16px; width: 16px; height: 16px;">delete</mat-icon>
          </button>
        </div>
      </div>
      
      <ng-template #noImage>
        <div class="flex flex-col items-center justify-center pt-5 pb-6">
          <svg
            *ngIf="!isUploading()"
            class="w-8 h-8 mb-3 text-slate-400"
            [class.text-indigo-500]="isDragging()"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 20 16"
          >
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"
            />
          </svg>
          
          <div *ngIf="isUploading()" class="flex flex-col items-center">
            <span class="w-8 h-8 mb-3 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></span>
            <p class="text-xs text-indigo-500 font-medium">Uploading...</p>
          </div>

          <ng-container *ngIf="!isUploading()">
            <p
              class="mb-1 text-sm"
              [class.text-slate-400]="theme.isDark()"
              [class.text-slate-500]="!theme.isDark()"
            >
              <span class="font-semibold text-indigo-500">{{
                lang.currentLang() === 'km' ? 'ចុចដើម្បីជ្រើសរើស' : 'Click to upload'
              }}</span>
              {{ lang.currentLang() === 'km' ? 'ឬអូសមកទីនេះ' : 'or drag and drop' }}
            </p>
            <p
              class="text-xs"
              [class.text-slate-500]="theme.isDark()"
              [class.text-slate-400]="!theme.isDark()"
            >
              SVG, PNG, JPG or GIF
            </p>
          </ng-container>
        </div>
      </ng-template>
      
      <input
        type="file"
        class="hidden"
        accept="image/*"
        (change)="onFileSelected($event)"
        [disabled]="isUploading()"
      />
    </label>
  </div>
</div>
