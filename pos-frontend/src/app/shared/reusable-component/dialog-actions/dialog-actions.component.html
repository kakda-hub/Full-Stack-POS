@if (form) {
  <mat-dialog-actions align="end">
    <button type="button" matButton="outlined" mat-dialog-close>
      {{ 'button.cancel' | translate }}
    </button>
    <!-- [disabled]="form.invalid" -->
    <button type="submit" matButton="outlined">
      {{ 'button.save' | translate }}
    </button>
  </mat-dialog-actions>
}
