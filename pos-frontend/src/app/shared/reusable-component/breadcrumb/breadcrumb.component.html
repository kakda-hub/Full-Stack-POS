<nav>
  <ol>
    <li *ngFor="let breadcrumb of breadcrumbs; let last = last">

          {{ lang.currentLang() === 'km' ? breadcrumb.labelKh : breadcrumb.label }}
        </h1>
      </div>
    </li>
  </ol>
