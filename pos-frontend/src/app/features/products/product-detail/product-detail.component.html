<form [formGroup]="form" (ngSubmit)="onSubmit()">>
  <app-header-detail [id]="product?.id"></app-header-detail>

  <mat-dialog-content>
    <div>
      <app-input-field formControlName="name" placeholder="ឈ្មោះ" [isRequired]="true">
      </app-input-field>

      <app-input-field formControlName="nameKh" placeholder="ឈ្មោះខ្មែរ" [isRequired]="true">
      </app-input-field>

      <app-input-field formControlName="price" placeholder="តម្លៃ ($)" [isRequired]="true">
      </app-input-field>

      <app-input-field formControlName="stock" placeholder="ស្តុក" [isRequired]="true">
      </app-input-field>

      <app-input-field formControlName="barcode" placeholder="បាកូដ" [isRequired]="true">
      </app-input-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>{{'label.category' | translate}}</mat-label>
        <mat-select formControlName="categoryId">
          @for (item of categories; track item) {
          <mat-option [value]="item.id">{{ item.name }}</mat-option>
          }
        </mat-select>
        <mat-error *ngIf="form.get('categoryId')?.hasError('required')">{{'validate.required' | translate}}
        </mat-error>
      </mat-form-field>

      <app-textarea formControlName="description" placeholder="ការពិពណ៌នា" class="w-full">
      </app-textarea>

      <div class="col-span-2">
        <label
          [class.text-slate-300]="theme.isDark()"
          [class.text-slate-700]="!theme.isDark()"
          class="block text-sm font-semibold mb-1.5"
          >{{ lang.currentLang() === 'km' ? 'រូបភាព' : 'Product Image' }}</label
        >
        <div
          class="flex items-center justify-center w-full border-2 border-dashed rounded-xl transition-all overflow-hidden relative"
          [class.bg-slate-700]="theme.isDark()"
          [class.border-slate-600]="theme.isDark()"
          [class.hover:border-indigo-500]="theme.isDark()"
          [class.bg-slate-50]="!theme.isDark()"
          [class.border-slate-300]="!theme.isDark()"
          [class.hover:border-indigo-400]="!theme.isDark()"
        >
          <label class="flex flex-col items-center justify-center w-full h-32 cursor-pointer">
            <div *ngIf="form.get('imgUrl')?.value; else noImage" class="absolute inset-0">
              <img
                [src]="form.get('imgUrl')?.value"
                class="w-full h-full object-contain bg-black/5"
              />
              <div
                class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity"
              >
                <span class="text-white text-sm font-semibold">{{
                  lang.currentLang() === 'km' ? 'ប្តូររូបភាព' : 'Change Image'
                }}</span>
              </div>
            </div>
            <ng-template #noImage>
              <div class="flex flex-col items-center justify-center pt-5 pb-6">
                <svg
                  *ngIf="!isUploading()"
                  class="w-8 h-8 mb-3 text-slate-400"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 20 16"
                >
                  <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"
                  />
                </svg>
                <span
                  *ngIf="isUploading()"
                  class="w-8 h-8 mb-3 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"
                ></span>
                <p
                  class="mb-2 text-sm"
                  [class.text-slate-400]="theme.isDark()"
                  [class.text-slate-500]="!theme.isDark()"
                >
                  <span class="font-semibold">{{
                    lang.currentLang() === 'km' ? 'ចុចដើម្បីជ្រើសរើសរូបភាព' : 'Click to upload'
                  }}</span>
                </p>
                <p
                  class="text-xs"
                  [class.text-slate-500]="theme.isDark()"
                  [class.text-slate-400]="!theme.isDark()"
                >
                  SVG, PNG, JPG or GIF
                </p>
              </div>
            </ng-template>
            <input
              type="file"
              class="hidden"
              accept="image/*"
              (change)="onFileSelected($event)"
              [disabled]="isUploading()"
            />
          </label>
        </div>
      </div>

      <!-- <pre>
      {{ this.form.value | json }}
    </pre> -->
  </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-raised-button mat-dialog-close>បោះបង់</button>
    <button type="submit" [disabled]="form.invalid" mat-raised-button>រក្សាទុក</button>
  </mat-dialog-actions>
</form>
