<div class="min-h-screen bg-slate-100 flex items-center justify-center p-4 font-sans">
  <div class="max-w-md w-full bg-white rounded-[2rem] shadow-2xl p-8 relative">
    <div class="absolute top-6 right-6">
      <button
        (click)="lang.toggle()"
        class="flex items-center gap-2 px-4 py-2 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 transition-all border border-slate-200 font-medium text-sm shadow-sm"
      >
        <span>{{ lang.currentLang() === 'en' ? '🇰🇭' : '🇬🇧' }}</span>
        {{ lang.currentLang() === 'en' ? ('resetPassword.switchToKhmer' | translate) : ('resetPassword.switchToEnglish' | translate) }}
      </button>
    </div>

    <div class="mb-8 mt-4 text-center">
      <h2 class="text-3xl font-bold text-slate-800">
        {{ 'resetPassword.title' | translate }}
      </h2>
      <p class="text-slate-500 mt-2">
        {{ 'resetPassword.subtitle' | translate }}
      </p>
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">
          {{ 'resetPassword.newPassword' | translate }}
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
          </span>
          <input 
            [type]="showPassword ? 'text' : 'password'"
            formControlName="newPassword"
            class="w-full pl-10 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all outline-none" 
            placeholder="••••••"
            [class.border-rose-500]="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched"
          >
          <button 
            type="button"
            (click)="showPassword = !showPassword"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 transition-colors"
          >
            <svg *ngIf="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            <svg *ngIf="showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path></svg>
          </button>
        </div>
        <p *ngIf="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched" class="text-rose-500 text-xs mt-1">
          {{ 'resetPassword.minLengthError' | translate }}
        </p>
      </div>

      <div *ngIf="successMessage" class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 text-emerald-600 text-sm flex items-center gap-3">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
        <span>{{ successMessage }}</span>
      </div>

      <div *ngIf="errorMessage" class="bg-rose-50 border border-rose-200 rounded-xl p-4 text-rose-600 text-sm flex items-center gap-3">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        <span>{{ errorMessage }}</span>
      </div>

      <app-ui-button [variant]="'primary'" [size]="'md'" type="submit" [loading]="loading" [fullWidth]="true" [disabled]="!token">
        {{ 'resetPassword.submit' | translate }}
      </app-ui-button>

      <div class="text-center mt-4">
        <a routerLink="/login" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">
          {{ 'resetPassword.backToLogin' | translate }}
        </a>
      </div>
    </form>
  </div>
</div>
