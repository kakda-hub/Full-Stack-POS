<div class="flex h-full overflow-hidden relative bg-[#F1F5F9] dark:bg-slate-950">
  <!-- LEFT: Product Grid -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- Search & Category Bar -->
    <div
      class="bg-white/90 dark:bg-slate-900/90 backdrop-blur-sm border-b border-slate-200/70 dark:border-slate-800/60 px-3 sm:px-4 lg:px-6 pt-4 sm:pt-5 pb-3 sm:pb-4 space-y-4 sm:space-y-5 shadow-sm">
      <!-- Search -->
      <app-search-input size="lg" placeholder="sales.search" (search)="onSearch($event)"
        (enter)="onBarcodeEnter($event)"></app-search-input>

      <!-- Category Tabs -->
      <app-category-tabs></app-category-tabs>

      <!-- Quick Pick Buttons (non-barcoded items) -->
      <app-quick-pick-view [quickPicks]="quickPicks()" (addQuickPick)="addQuickPick($event)"></app-quick-pick-view>
    </div>

    <!-- Product Grid -->
    <div class="flex-1 overflow-y-auto p-4" (scroll)="onProductScroll($event)">
      @if (isLoadingProducts()) {
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 2xl:grid-cols-6 gap-4">
        @for (i of [1, 2, 3, 4, 5, 6, 7, 8]; track i) {
        <div class="h-40 sm:h-44 lg:h-52 bg-slate-200 dark:bg-slate-800 animate-pulse rounded-[2rem]"></div>
        }
      </div>
      } @else {
      <div [@listAnimation]="productService.filteredProducts().length"
        class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 2xl:grid-cols-6 gap-4 pb-12">
        @for (product of productService.filteredProducts(); track trackById($index, product)) {
        <app-product-card @fadeIn [product]="product" [isInCart]="isInCart(product)" [quantity]="cartQuantity(product)"
          [effectiveStock]="effectiveStock(product)" [photoResolver]="getProductPhoto"
          [isLastAdded]="lastAddedId() === product.id" [isShaking]="shakingProductId() === product.id"
          (addToCart)="addToCart(product)" (removeFromCart)="cart.removeItem(product.id)"
          (decreaseQuantity)="cart.updateQuantity(product.id, $event)"
          (increaseQuantity)="cart.updateQuantity(product.id, $event)" class="w-full h-full"></app-product-card>
        }
      </div>
      }

      <!-- Infinite scroll: loading-more indicator -->
      @if (productService.loadingMore()) {
      <div class="flex items-center justify-center gap-3 py-6" [@fadeIn]>
        <span
          class="w-6 h-6 border-[3px] border-indigo-200 dark:border-indigo-900/40 border-t-indigo-500 rounded-full animate-spin"></span>
      </div>
      }
    </div>
  </div>

  <!-- RIGHT: Cart Sidebar -->
  <app-right-cart-sidebar [isCartOpen]="isCartOpen" [subtotalDisplay]="subtotalDisplay" [taxDisplay]="taxDisplay"
    [totalDisplay]="totalDisplay" [photoResolver]="getProductPhoto" [isMobile]="isMobile"
    [isCartDrawerOpen]="isCartDrawerOpen" (clearCart)="clearCart()" (checkout)="openPaymentModal()"
    (toggleCartSidebar)="toggleCartSidebar()" (closeCartDrawer)="closeCartDrawer()"></app-right-cart-sidebar>
