<div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
  <button
    *ngFor="let cat of productService.categories()"
    (click)="productService.setCategory(cat.id)"
    [class]="
      cat.id === productService.selectedCategory()
        ? 'px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm shadow-lg shadow-indigo-100 dark:shadow-indigo-900/30 whitespace-nowrap transition-all'
        : 'px-4 py-2 bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-medium hover:border-indigo-200 dark:hover:border-indigo-600 hover:text-indigo-600 dark:hover:text-indigo-400 transition-all whitespace-nowrap'
    "
    type="button"
  >
    {{ langService.currentLang() === 'km' ? cat.nameKm || cat.name : cat.name }}
  </button>
</div>
