<button
  type="button"
  (click)="addToCart.emit()"
  [disabled]="effectiveStock <= 0"
  [class]="
    isInCart
      ? 'product-card group bg-white dark:bg-slate-800 rounded-[2rem] border-2 border-indigo-500 shadow-xl shadow-indigo-100/50 dark:shadow-indigo-900/30 transition-all duration-300 cursor-pointer overflow-hidden flex flex-col w-full h-full scale-[1.02]'
      : 'product-card group bg-white dark:bg-slate-800 rounded-[2rem] border border-slate-100 dark:border-slate-700 shadow-sm hover:shadow-xl hover:shadow-indigo-100/50 dark:hover:shadow-indigo-900/20 transition-all duration-300 cursor-pointer overflow-hidden flex flex-col w-full h-full motion-safe:hover:-translate-y-1'
  "
>
  <!-- Stock add animation indicator -->
  @if (isLastAdded) {
    <span class="stock-add-fly text-indigo-500 dark:text-indigo-300">+1</span>
  }
  <!-- Shake animation -->
  <div [class.animate-shake]="isShaking" class="flex flex-col flex-1">
    <div class="product-card-image relative h-36 sm:h-40 lg:h-44 overflow-hidden">
      <!-- Cart quantity badge (top-left) -->
      @if (quantity > 0) {
        <span class="cart-qty-badge absolute top-3 left-3 z-10" [@counterAnimation]="quantity">{{ quantity }}</span>
      }
      <!-- Category label chip (top-right) -->
      @if (categoryName) {
        <span class="category-chip absolute top-3 right-3 z-10">{{ categoryName }}</span>
      }
      @let photo = product.imgUrl || photoResolver(product.category);
      <!-- Product image -->
      <div
        class="img-container w-full h-full p-3 sm:p-4"
        [class.img-loading]="photo"
      >
        @if (photo) {
          <img
            [src]="photo"
            [alt]="product.name"
            [class.opacity-30]="effectiveStock <= 0"
            class="img-photo"
            (load)="onImgLoad($event)"
            loading="lazy"
            appImgFallback
          />
        } @else {
          <div class="w-full h-full flex items-center justify-center bg-slate-50 dark:bg-slate-700/50 rounded-xl">
            <svg class="w-10 h-10 text-slate-300 dark:text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
          </div>
        }
      </div>
      <!-- Out of stock overlay -->
      @if (stockStatus === 'out') {
        <div class="absolute inset-0 bg-slate-900/20 dark:bg-slate-900/40 backdrop-blur-[1px] flex items-center justify-center">
          <span class="oos-badge">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
            </svg>
            {{ 'sales.outOfStock' | translate }}
          </span>
        </div>
      }
    </div>
    <div class="p-3 sm:p-4 lg:p-5 flex flex-col flex-1">
      <div class="flex-1 min-h-[2.5rem]">
        <h3 class="text-sm font-semibold text-slate-800 dark:text-slate-200 leading-snug line-clamp-2 text-left">
          {{ langService.currentLang() === 'km' ? product.nameKm || product.name : product.name }}
        </h3>
      </div>
      <div class="mt-3 pt-3 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between gap-2">
        <span class="text-lg font-black text-slate-900 dark:text-white leading-none tracking-tight tabular-nums">
          ${{ product.price.toFixed(2) }}
        </span>
        <!-- Stock status indicator -->
        @if (stockStatus === 'ok') {
          <span class="stock-indicator stock-indicator--ok">
            <span class="stock-dot"></span>
            {{ 'sales.inStock' | translate }}
          </span>
        } @else if (stockStatus === 'low') {
          <span class="stock-indicator stock-indicator--low">
            <span class="stock-dot"></span>
            {{ effectiveStock }} {{ 'sales.inStock' | translate }}
          </span>
        } @else {
          <span class="stock-indicator stock-indicator--out">
            <span class="stock-dot"></span>
            {{ 'sales.outOfStock' | translate }}
          </span>
        }
      </div>
    </div>
  </div>
</button>
