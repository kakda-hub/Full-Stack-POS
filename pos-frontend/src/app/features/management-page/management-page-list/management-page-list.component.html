<div @pageTransition class="p-3 space-y-4">
  <app-breadcrumb></app-breadcrumb>
  
  <div class="flex justify-between items-center">
    <app-ui-button [variant]="'primary'" [size]="'md'" type="button">
      <span>{{ 'button.addNew' | translate }}</span>
    </app-ui-button>
  </div>
  
  <div class="hs-accordion-treeview-root" role="tree">
    <div class="hs-accordion-group" role="group">
      <!-- Initial call to the recursive template -->
      <ng-container *ngTemplateOutlet="treeNodeTemplate; context: { $implicit: managementPageList, level: 1 }"></ng-container>
    </div>
  </div>
  
  <!-- Recursive Template Definition -->
  <ng-template #treeNodeTemplate let-nodes let-level="level">
    <div *ngFor="let node of nodes" class="hs-accordion" [class.active]="node.expanded">
      
      <!-- Accordion Heading -->
      <div class="hs-accordion-heading py-0.5 flex items-center gap-x-0.5 w-full">
        
        <!-- Toggle Button (Show if type is 'menu' OR has children) -->
        <button *ngIf="node.type === 'menu' || (node.children && node.children.length > 0)"
                (click)="toggleNode(node)"
                type="button"
                class="hs-accordion-toggle size-6 flex justify-center items-center hover:bg-gray-100 rounded-md focus:outline-none">
          <svg class="size-4 text-gray-800 transition-transform" [class.rotate-90]="node.expanded" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </button>
  
        <!-- Placeholder for leaf pages to keep alignment -->
        <div *ngIf="node.type === 'page' && (!node.children || node.children.length === 0)" class="size-6"></div>
  
        <!-- Selectable Label -->
        <div (click)="selectNode(node)"
             [class.bg-blue-50]="node.selected"
             class="grow px-1.5 rounded-md cursor-pointer hover:bg-gray-100 transition-colors">
          <div class="flex items-center gap-x-3 py-1">
            
            <!-- Folder Icon (Menu) -->
            <svg *ngIf="node.type === 'menu'" class="shrink-0 size-4 text-blue-600" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
            </svg>
            
            <!-- File Icon (Page) -->
            <svg *ngIf="node.type === 'page'" class="shrink-0 size-4 text-gray-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>
            </svg>
            
            <div class="grow">
              <!-- Using 'title' from your data. You can also use node.titleKm based on language -->
              <span class="text-sm font-medium text-gray-800">{{ node.title }}</span>
              <span *ngIf="node.url" class="text-xs text-gray-400 ml-2 font-normal">{{ node.url }}</span>
            </div>
          </div>
        </div>

        <!-- Action Menu -->
        <div>
          <button mat-icon-button [matMenuTriggerFor]="menu">
            <mat-icon class="text-gray-500">more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <button mat-menu-item>
              <mat-icon>edit</mat-icon>
              <span>Edit</span>
            </button>
            <button mat-menu-item class="text-red-600">
              <mat-icon class="text-red-600">delete</mat-icon>
              <span>Delete</span>
            </button>
          </mat-menu>
        </div>
      </div>
  
      <!-- Recursive Children Content -->
      <div *ngIf="node.expanded && node.children?.length > 0" 
           class="ps-7 relative before:absolute before:top-0 before:left-3 before:-ml-px before:h-full before:border-l before:border-gray-200">
        <ng-container *ngTemplateOutlet="treeNodeTemplate; context: { $implicit: node.children, level: level + 1 }"></ng-container>
      </div>
  
    </div>
  </ng-template>
</div>
