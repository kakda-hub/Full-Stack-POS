<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <app-header-detail
    [id]="id"
    [title]="id
      ? ('categories.editTitle' | translate)
      : ('categories.addTitle' | translate)"
  ></app-header-detail>

  <mat-dialog-content class="dialog-content">
    <div class="form-body">
      <!-- Image upload -->
      <div class="flex justify-center">
        <app-image-upload-avatar
          [imageUrl]="form.get('imgUrl')?.value"
          [isMultiple]="false"
          (imageChange)="onImageChange($event)"
          (remove)="onImageRemove()"
        ></app-image-upload-avatar>
      </div>

      <!-- Form fields -->
      <div class="form-grid">
        <app-input-field
          formControlName="name"
          [placeholder]="'categories.name' | translate"
          [isRequired]="true"
        ></app-input-field>

        <app-input-field
          formControlName="nameKh"
          [placeholder]="'categories.nameKm' | translate"
        ></app-input-field>
      </div>

      <app-textarea
        formControlName="description"
        [placeholder]="'categories.description' | translate"
        [rows]="3"
      ></app-textarea>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions">
    <app-ui-button [variant]="'secondary'" [size]="'md'" mat-dialog-close type="button">{{
      'button.cancel' | translate
    }}</app-ui-button>
    <app-ui-button [variant]="'primary'" [size]="'md'" type="submit" [loading]="isSaving()">{{
      'button.save' | translate
    }}</app-ui-button>
  </mat-dialog-actions>
</form>
