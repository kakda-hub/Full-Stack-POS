<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div
    @backdropAnimation
    class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"
    (click)="cancel.emit()"
  ></div>
  <div
    @modalAnimation
    [class.bg-slate-800]="theme.isDark()"
    [class.bg-white]="!theme.isDark()"
    class="relative rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto"
  >
    <div
      [class.bg-slate-800]="theme.isDark()"
      [class.border-slate-700]="theme.isDark()"
      [class.bg-white]="!theme.isDark()"
      [class.border-slate-100]="!theme.isDark()"
      class="px-6 py-4 border-b flex items-center justify-between sticky top-0 z-10"
    >
      <h2 class="text-lg font-bold text-slate-800">
        {{
          category
            ? lang.currentLang() === 'km'
              ? 'កែប្រែប្រភេទ'
              : 'Edit Category'
            : lang.currentLang() === 'km'
              ? 'បន្ថែមប្រភេទ'
              : 'Add Category'
        }}
      </h2>
      <button
        type="button"
        aria-label="Toggle close"
        (click)="cancel.emit()"
        [class.hover:bg-slate-700]="theme.isDark()"
        [class.hover:bg-slate-100]="!theme.isDark()"
        class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 transition-colors"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-6 space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div class="col-span-2">
          <label
            [class.text-slate-300]="theme.isDark()"
            [class.text-slate-700]="!theme.isDark()"
            class="block text-sm font-semibold mb-1.5"
            >{{ lang.currentLang() === 'km' ? 'ឈ្មោះ (English)' : 'Name (English)' }} *</label
          >
          <input
            aria-label="Name"
            formControlName="name"
            type="text"
            [class.bg-slate-700]="theme.isDark()"
            [class.border-slate-600]="theme.isDark()"
            [class.text-slate-100]="theme.isDark()"
            [class.bg-white]="!theme.isDark()"
            [class.border-slate-200]="!theme.isDark()"
            class="w-full border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
            [class.border-rose-400]="form.get('name')?.invalid && form.get('name')?.touched"
          />
        </div>
        <div class="col-span-2">
          <label
            [class.text-slate-300]="theme.isDark()"
            [class.text-slate-700]="!theme.isDark()"
            class="block text-sm font-semibold mb-1.5"
            >{{ lang.currentLang() === 'km' ? 'ឈ្មោះ (ខ្មែរ)' : 'Name (Khmer)' }}</label
          >
          <input
            aria-label="Name (Khmer)"
            formControlName="nameKh"
            type="text"
            [class.bg-slate-700]="theme.isDark()"
            [class.border-slate-600]="theme.isDark()"
            [class.text-slate-100]="theme.isDark()"
            [class.bg-white]="!theme.isDark()"
            [class.border-slate-200]="!theme.isDark()"
            class="w-full border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
          />
        </div>

        <div class="col-span-2">
          <label
            [class.text-slate-300]="theme.isDark()"
            [class.text-slate-700]="!theme.isDark()"
            class="block text-sm font-semibold mb-1.5"
            >{{ lang.currentLang() === 'km' ? 'រូបភាព' : 'Image' }}</label
          >
          <div
            class="flex items-center justify-center w-full border-2 border-dashed rounded-xl transition-all overflow-hidden relative"
            [class.bg-slate-700]="theme.isDark()"
            [class.border-slate-600]="theme.isDark()"
            [class.hover:border-indigo-500]="theme.isDark()"
            [class.bg-slate-50]="!theme.isDark()"
            [class.border-slate-300]="!theme.isDark()"
            [class.hover:border-indigo-400]="!theme.isDark()"
          >
            <label class="flex flex-col items-center justify-center w-full h-32 cursor-pointer">
              <div *ngIf="form.get('imgUrl')?.value; else noImage" class="absolute inset-0">
                <img [src]="form.get('imgUrl')?.value" class="w-full h-full object-contain bg-black/5" />
                <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity">
                  <span class="text-white text-sm font-semibold">{{ lang.currentLang() === 'km' ? 'ប្តូររូបភាព' : 'Change Image' }}</span>
                </div>
              </div>
              <ng-template #noImage>
                <div class="flex flex-col items-center justify-center pt-5 pb-6">
                  <svg *ngIf="!isUploading()" class="w-8 h-8 mb-3 text-slate-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                  </svg>
                  <span *ngIf="isUploading()" class="w-8 h-8 mb-3 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></span>
                  <p class="mb-2 text-sm" [class.text-slate-400]="theme.isDark()" [class.text-slate-500]="!theme.isDark()">
                    <span class="font-semibold">{{ lang.currentLang() === 'km' ? 'ចុចដើម្បីជ្រើសរើសរូបភាព' : 'Click to upload' }}</span>
                  </p>
                  <p class="text-xs" [class.text-slate-500]="theme.isDark()" [class.text-slate-400]="!theme.isDark()">SVG, PNG, JPG or GIF</p>
                </div>
              </ng-template>
              <input type="file" class="hidden" accept="image/*" (change)="onFileSelected($event)" [disabled]="isUploading()" />
            </label>
          </div>
        </div>

        <div class="col-span-2">
          <label
            [class.text-slate-300]="theme.isDark()"
            [class.text-slate-700]="!theme.isDark()"
            class="block text-sm font-semibold mb-1.5"
            >{{ lang.currentLang() === 'km' ? 'ការពិពណ៌នា' : 'Description' }}</label
          >
          <textarea
            aria-label="Description"
            formControlName="description"
            rows="3"
            [class.bg-slate-700]="theme.isDark()"
            [class.border-slate-600]="theme.isDark()"
            [class.text-slate-100]="theme.isDark()"
            [class.bg-white]="!theme.isDark()"
            [class.border-slate-200]="!theme.isDark()"
            class="w-full border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all resize-none"
          ></textarea>
        </div>
      </div>

      <div class="flex gap-3 pt-2">
        <button
          type="button"
          (click)="cancel.emit()"
          [class.border-slate-600]="theme.isDark()"
          [class.text-slate-300]="theme.isDark()"
          [class.hover:bg-slate-700]="theme.isDark()"
          [class.border-slate-200]="!theme.isDark()"
          [class.text-slate-700]="!theme.isDark()"
          [class.hover:bg-slate-50]="!theme.isDark()"
          class="flex-1 px-4 py-2.5 rounded-xl border font-semibold text-sm transition-all"
        >
          {{ lang.currentLang() === 'km' ? 'បោះបង់' : 'Cancel' }}
        </button>
        <button
          type="submit"
          [disabled]="form.invalid || isSaving()"
          class="flex-1 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-2.5 rounded-xl transition-all text-sm flex items-center justify-center gap-2"
        >
          <span *ngIf="isSaving()" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
          {{ lang.currentLang() === 'km' ? 'រក្សាទុក' : 'Save Category' }}
        </button>
      </div>
    </form>
  </div>
</div>
