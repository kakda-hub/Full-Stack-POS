<div @pageTransition class="p-3 sm:p-4 lg:p-6 space-y-4 sm:space-y-6">
  <!-- Header -->
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-black text-slate-900">
        {{ lang.currentLang() === 'km' ? 'ប្រភេទ' : 'Categories' }}
      </h1>
      <p class="text-sm text-slate-500 mt-0.5">
        {{ categories().length }}
        {{ lang.currentLang() === 'km' ? 'ប្រភេទសរុប' : 'total categories' }}
      </p>
    </div>

    <button
      (click)="openAdd()"
      class="bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold px-5 py-2.5 rounded-xl transition-all shadow-sm hover:shadow-md flex items-center gap-2"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
      </svg>
      {{ lang.currentLang() === 'km' ? 'បន្ថែមប្រភេទ' : 'Add Category' }}
    </button>
  </div>

  <!-- Filters -->
  <div class="flex gap-2 sm:gap-3 flex-wrap">
    <div id="search" class="relative flex-1 min-w-48">
      <svg
        class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <input
        aria-label="Search"
        type="text"
        (input)="onSearch($event)"
        [placeholder]="lang.currentLang() === 'km' ? 'ស្វែងរកប្រភេទ...' : 'Search categories...'"
        [class.bg-slate-700]="theme.isDark()"
        [class.border-slate-600]="theme.isDark()"
        [class.text-slate-100]="theme.isDark()"
        [class.bg-white]="!theme.isDark()"
        [class.border-slate-200]="!theme.isDark()"
        class="w-full pl-9 pr-4 py-2.5 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
      />
    </div>
  </div>

  <!-- Table (skeleton + data handled inside DynamicTableComponent) -->
  <app-dynamic-table
    [columns]="columns"
    [rows]="paginatedCategories()"
    [totalCount]="filteredCategories().length"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [isLoading]="isLoading()"
    (onEdit)="openEdit($event)"
    (onDelete)="deleteCategory($event)"
    (pageChange)="onPageChange($event)"
  ></app-dynamic-table>
</div>

<!-- Form Modal -->
<app-category-detail
  *ngIf="showForm"
  [category]="editingCategory"
  (save)="onSave($event)"
  (cancel)="showForm = false; editingCategory = null"
></app-category-detail>
