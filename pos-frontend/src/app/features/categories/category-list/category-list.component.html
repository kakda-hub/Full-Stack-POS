<div @pageTransition class="flex flex-col gap-y-4 p-3">
  <div class="flex items-center justify-between">
    <app-breadcrumb></app-breadcrumb>

    <div class="flex items-center gap-4">
      <div class="filters-bar">
        <div class="search-wrapper">
          <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>
          <input
            aria-label="Search"
            type="text"
            (input)="onSearch($event)"
            [placeholder]="lang.currentLang() === 'km' ? 'ស្វែងរក...' : 'Search ...'"
            class="search-input"
          />
        </div>
      </div>
      <app-ui-button [variant]="'primary'" [size]="'md'" (click)="openDialog()">
        <span>{{ 'button.addNew' | translate }}</span>
      </app-ui-button>
    </div>
  </div>

  <!-- Table (skeleton + data handled inside DynamicTableComponent) -->
  <app-dynamic-table
    [columns]="columns"
    [rows]="paginatedCategories()"
    [totalCount]="filteredCategories().length"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [isLoading]="isLoading()"
    (onEdit)="openEdit($event)"
    (onDelete)="deleteCategory($event)"
    (pageChange)="onPageChange($event)"
  ></app-dynamic-table>
</div>
