<div class="not-found-layout">
  <!-- THEME-SAFE GRAPHIC -->
  <div class="not-found-icon-wrapper">
    <svg
      viewBox="0 0 100 100"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      class="w-full h-full"
    >
      <g class="icon-base">
        <circle cx="50" cy="50" r="45" class="stroke-current not-found-icon-stroke" />
        <path d="M50 35v30" class="stroke-current not-found-icon-stroke" stroke-width="8" stroke-linecap="round" />
        <path d="M50 65h0.001" class="stroke-current text-indigo-600" stroke-width="8" stroke-linecap="round" />
      </g>
      <circle cx="50" cy="50" r="35" stroke="currentColor" stroke-width="2" fill="transparent" class="text-indigo-600 opacity-20 animate-pulse" />
    </svg>
  </div>

  <div class="flex flex-col items-center max-w-md">
    <p class="not-found-404">404</p>
    <p class="not-found-title">
      {{ 'notFound.title' | translate }}
    </p>
    <p class="not-found-subtitle">
      {{ 'notFound.subtitle' | translate }}
    </p>
  </div>

  <div class="flex space-x-2">
    <button
      (click)="goBack()"
      class="not-found-btn not-found-btn--back"
    >
      {{ 'notFound.back' | translate }}
    </button>

    <button
      (click)="goToHome()"
      class="not-found-btn not-found-btn--home"
    >
      {{ 'notFound.home' | translate }}
    </button>
  </div>
</div>
