<form [formGroup]="form">
  <app-header-detail [id]="id"></app-header-detail>

  <mat-dialog-content>
    <div class="flex flex-col gap-2 w-full">
      <app-input-field
        formControlName="username"
        [placeholder]="'label.username' | translate"
        [isRequired]="true"
      >
      </app-input-field>
      <app-input-field formControlName="phone" [placeholder]="'label.phone' | translate" [isRequired]="true">
      </app-input-field>

      <mat-form-field appearance="outline">
        <mat-label>{{'label.role' | translate}}</mat-label>
        <mat-select formControlName="role">
          @for (role of roles; track role) {
            <mat-option [value]="role.value">{{ role.viewValue }}</mat-option>
          }
        </mat-select>
        <mat-error *ngIf="form.get('role')?.hasError('required')">{{'validate.required' | translate}}</mat-error>
      </mat-form-field>

      <app-input-field formControlName="email" type="email" [placeholder]="'label.email' | translate">
      </app-input-field>

      <app-input-field
        formControlName="password"
        type="password"
        [placeholder]="'label.password' | translate"
      >
      </app-input-field>

      <app-textarea
        formControlName="description"
        [placeholder]="'label.description' | translate"
      ></app-textarea>
    </div>
    <pre>
        {{ form.value | json }}
      </pre
    >
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button matButton mat-dialog-close>បោះបង់</button>
    <button type="submit" matButton>រក្សាទុក</button>
  </mat-dialog-actions>
</form>
