<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <app-header-detail
    [id]="id"
    [iconType]="'product'"
    [subtitle]="id ? (lang.currentLang() === 'km' ? 'កែប្រែទំនិញរហ័ស' : 'Edit quick pick item') : (lang.currentLang() === 'km' ? 'បន្ថែមទំនិញរហ័សថ្មី' : 'Add a new quick pick item')"
  ></app-header-detail>

  <mat-dialog-content class="dialog-content">
    <div class="form-body">
      <div class="form-grid">
        <app-input-field
          formControlName="label"
          [placeholder]="lang.currentLang() === 'km' ? 'ឈ្មោះ' : 'Label'"
          [isRequired]="true"
        >
          <span prefix class="text-slate-400 mr-1">⚡</span>
        </app-input-field>

        <app-input-field
          formControlName="labelKh"
          [placeholder]="lang.currentLang() === 'km' ? 'ឈ្មោះខ្មែរ' : 'Label (Khmer)'"
        ></app-input-field>

        <app-input-field
          formControlName="price"
          [placeholder]="lang.currentLang() === 'km' ? 'តម្លៃ' : 'Price'"
          [isRequired]="true"
        >
          <span prefix class="text-slate-400 mr-1">$</span>
        </app-input-field>

        <app-input-field
          formControlName="icon"
          [placeholder]="lang.currentLang() === 'km' ? 'រូបតំណាង (emoji)' : 'Icon (emoji)'"
        >
          <span prefix class="text-slate-400 mr-1">🎨</span>
        </app-input-field>

        <app-input-field
          formControlName="sortOrder"
          [placeholder]="lang.currentLang() === 'km' ? 'លំដាប់' : 'Sort Order'"
          type="number"
        ></app-input-field>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions">
    <app-ui-button [variant]="'secondary'" [size]="'md'" mat-dialog-close type="button">{{
      'button.cancel' | translate
    }}</app-ui-button>
    <app-ui-button [variant]="'primary'" [size]="'md'" type="submit" [loading]="isSaving()">{{
      'button.save' | translate
    }}</app-ui-button>
  </mat-dialog-actions>
</form>
