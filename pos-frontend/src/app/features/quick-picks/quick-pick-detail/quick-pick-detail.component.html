<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <app-header-detail
    [id]="id"
    [title]="id ? ('quickPicks.editTitle' | translate) : ('quickPicks.addTitle' | translate)"
  ></app-header-detail>

  <mat-dialog-content class="dialog-content">
    <div class="form-body">
      <div class="form-grid">
        <app-input-field
          formControlName="label"
          [placeholder]="'quickPicks.label' | translate"
          [isRequired]="true"
        >
          <span prefix class="text-slate-400 mr-1">⚡</span>
        </app-input-field>

        <app-input-field
          formControlName="labelKh"
          [placeholder]="'quickPicks.labelKhmerPlaceholder' | translate"
        ></app-input-field>

        <app-input-field
          formControlName="price"
          [placeholder]="'quickPicks.price' | translate"
          [isRequired]="true"
        >
          <span prefix class="text-slate-400 mr-1">$</span>
        </app-input-field>

        <app-input-field
          formControlName="icon"
          [placeholder]="'quickPicks.iconEmoji' | translate"
        >
          <span prefix class="text-slate-400 mr-1">🎨</span>
        </app-input-field>

        <app-input-field
          formControlName="sortOrder"
          [placeholder]="'quickPicks.sortOrder' | translate"
          type="number"
        ></app-input-field>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions">
    <app-ui-button [variant]="'secondary'" [size]="'md'" mat-dialog-close type="button">{{
      'button.cancel' | translate
    }}</app-ui-button>
    <app-ui-button [variant]="'primary'" [size]="'md'" type="submit" [loading]="isSaving()">{{
      'button.save' | translate
    }}</app-ui-button>
  </mat-dialog-actions>
</form>
