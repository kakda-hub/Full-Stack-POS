<div @pageTransition class="p-3 space-y-4">
  <!-- Header -->
  <div class="flex items-center justify-between">
    <app-breadcrumb></app-breadcrumb>
  </div>

  <div @fadeIn class="rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
    <div class="px-5 py-4 border-b border-slate-100">
      <h2 class="font-bold text-slate-800">
        {{ lang.currentLang() === 'km' ? 'ការអនុញ្ញាត' : 'Role Permissions' }}
      </h2>
    </div>
    <table class="w-full text-sm">
      <thead class="bg-slate-50 border-b border-slate-100">
        <tr>
          <th class="px-5 py-3 text-left font-semibold text-slate-600">
            {{ lang.currentLang() === 'km' ? 'លក្ខណៈ' : 'Feature' }}
          </th>
          <th class="px-5 py-3 text-center font-semibold text-indigo-600">Admin</th>
          <th class="px-5 py-3 text-center font-semibold text-emerald-600">Cashier</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-50">
        <tr *ngFor="let perm of permissions" class="hover:bg-slate-50">
          <td class="px-5 py-3 text-slate-700">
            {{ lang.currentLang() === 'km' ? perm.labelKm : perm.label }}
          </td>
          <td class="px-5 py-3 text-center">
            <span *ngIf="perm.admin" class="text-emerald-500 text-lg">✓</span>
            <span *ngIf="!perm.admin" class="text-slate-300 text-lg">✗</span>
          </td>
          <td class="px-5 py-3 text-center">
            <span *ngIf="perm.cashier" class="text-emerald-500 text-lg">✓</span>
            <span *ngIf="!perm.cashier" class="text-slate-300 text-lg">✗</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
