<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <app-header-detail
    [id]="id"
    [title]="id ? ('suppliers.editTitle' | translate) : ('suppliers.addTitle' | translate)"
  ></app-header-detail>

  <mat-dialog-content class="dialog-content">
    <div class="form-body">
      <div class="form-grid">
        <app-input-field
          formControlName="name"
          [placeholder]="'suppliers.name' | translate"
          [isRequired]="true"
        ></app-input-field>

        <app-input-field
          formControlName="contactPerson"
          [placeholder]="'suppliers.contactPerson' | translate"
        ></app-input-field>

        <app-input-field
          formControlName="phone"
          [placeholder]="'suppliers.phone' | translate"
        ></app-input-field>

        <app-input-field
          formControlName="email"
          [placeholder]="'suppliers.email' | translate"
        ></app-input-field>

        <app-input-field
          formControlName="taxId"
          [placeholder]="'suppliers.taxId' | translate"
        ></app-input-field>
      </div>

      <div class="form-grid">
        <app-textarea
          formControlName="address"
          [placeholder]="'suppliers.address' | translate"
          [rows]="2"
        ></app-textarea>

        <app-textarea
          formControlName="notes"
          [placeholder]="'suppliers.notes' | translate"
          [rows]="2"
        ></app-textarea>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions">
    <app-ui-button [variant]="'secondary'" [size]="'md'" mat-dialog-close type="button">{{
      'button.cancel' | translate
    }}</app-ui-button>
    <app-ui-button [variant]="'primary'" [size]="'md'" type="submit" [loading]="isSaving()">{{
      'button.save' | translate
    }}</app-ui-button>
  </mat-dialog-actions>
</form>
