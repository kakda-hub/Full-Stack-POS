<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <app-header-detail
    [id]="id"
    [title]="id
      ? (lang.currentLang() === 'km' ? 'កែប្រែអ្នកផ្គត់ផ្គង់' : 'Edit Supplier')
      : (lang.currentLang() === 'km' ? 'បន្ថែមអ្នកផ្គត់ផ្គង់' : 'Add Supplier')"
  ></app-header-detail>

  <mat-dialog-content class="px-3 !pb-2">
    <div class="flex flex-col gap-5">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <app-input-field
          formControlName="name"
          [placeholder]="lang.currentLang() === 'km' ? 'ឈ្មោះអ្នកផ្គត់ផ្គង់' : 'Supplier Name'"
          [isRequired]="true"
        ></app-input-field>

        <app-input-field
          formControlName="contactPerson"
          [placeholder]="lang.currentLang() === 'km' ? 'អ្នកទំនាក់ទំនង' : 'Contact Person'"
        ></app-input-field>

        <app-input-field
          formControlName="phone"
          [placeholder]="lang.currentLang() === 'km' ? 'ទូរស័ព្ទ' : 'Phone'"
        ></app-input-field>

        <app-input-field
          formControlName="email"
          [placeholder]="lang.currentLang() === 'km' ? 'អ៊ីមែល' : 'Email'"
        ></app-input-field>

        <app-input-field
          formControlName="taxId"
          [placeholder]="lang.currentLang() === 'km' ? 'លេខសម្គាល់ពន្ធ' : 'Tax ID'"
        ></app-input-field>
      </div>

      <app-textarea
        formControlName="address"
        [placeholder]="lang.currentLang() === 'km' ? 'អាសយដ្ឋាន' : 'Address'"
        [rows]="2"
      ></app-textarea>

      <app-textarea
        formControlName="notes"
        [placeholder]="lang.currentLang() === 'km' ? 'កំណត់ចំណាំ' : 'Notes'"
        [rows]="2"
      ></app-textarea>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="w-full gap-3 px-6 pb-5 pt-1">
    <app-ui-button [variant]="'secondary'" [size]="'md'" mat-dialog-close type="button">{{
      'button.cancel' | translate
    }}</app-ui-button>
    <app-ui-button [variant]="'primary'" [size]="'md'" type="submit" [loading]="isSaving()">{{
      'button.save' | translate
    }}</app-ui-button>
  </mat-dialog-actions>
</form>
