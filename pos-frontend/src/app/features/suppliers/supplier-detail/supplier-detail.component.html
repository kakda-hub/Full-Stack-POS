<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <app-header-detail [id]="id"></app-header-detail>

  <mat-dialog-content class="dialog-content">
    <div class="form-body">
      <div class="form-grid">
        <app-input-field
          formControlName="name"
          [placeholder]="lang.currentLang() === 'km' ? 'ឈ្មោះអ្នកផ្គត់ផ្គង់' : 'Supplier Name'"
          [isRequired]="true"
        ></app-input-field>

        <app-input-field
          formControlName="contactPerson"
          [placeholder]="lang.currentLang() === 'km' ? 'អ្នកទំនាក់ទំនង' : 'Contact Person'"
        ></app-input-field>

        <app-input-field
          formControlName="phone"
          [placeholder]="lang.currentLang() === 'km' ? 'ទូរស័ព្ទ' : 'Phone'"
        ></app-input-field>

        <app-input-field
          formControlName="email"
          [placeholder]="lang.currentLang() === 'km' ? 'អ៊ីមែល' : 'Email'"
        ></app-input-field>

        <app-input-field
          formControlName="taxId"
          [placeholder]="lang.currentLang() === 'km' ? 'លេខសម្គាល់ពន្ធ' : 'Tax ID'"
        ></app-input-field>
      </div>

      <app-textarea
        formControlName="address"
        [placeholder]="lang.currentLang() === 'km' ? 'អាសយដ្ឋាន' : 'Address'"
        [rows]="2"
      ></app-textarea>

      <app-textarea
        formControlName="notes"
        [placeholder]="lang.currentLang() === 'km' ? 'កំណត់ចំណាំ' : 'Notes'"
        [rows]="2"
      ></app-textarea>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions">
    <app-ui-button [variant]="'secondary'" [size]="'md'" mat-dialog-close type="button">{{
      'button.cancel' | translate
    }}</app-ui-button>
    <app-ui-button [variant]="'primary'" [size]="'md'" type="submit" [loading]="isSaving()">{{
      'button.save' | translate
    }}</app-ui-button>
  </mat-dialog-actions>
</form>
