<div class="flex flex-col gap-y-4 p-3">
  <div class="flex items-center justify-between">
    <app-breadcrumb></app-breadcrumb>

    <div class="flex items-center gap-4">
      <app-search-input
        class="w-56"
        placeholder="suppliers.search"
        (search)="onSearch($event)"
      ></app-search-input>
      <app-ui-button [variant]="'primary'" [size]="'md'" (click)="openDialog()">
        <span>{{ 'button.addNew' | translate }}</span>
      </app-ui-button>
    </div>
  </div>

  <!-- Table (server-side paginated: rows are the current API page) -->
  <app-dynamic-table
    [columns]="columns"
    [rows]="suppliers()"
    [mobileRows]="mobileSuppliers()"
    [totalCount]="totalItems()"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [isLoading]="isLoading()"
    [infiniteScrollOnMobile]="true"
    [hasMore]="hasMore()"
    [isLoadingMore]="isLoadingMore()"
    (onEdit)="openEdit($event)"
    (onDelete)="deleteSupplier($event)"
    (pageChange)="onPageChange($event)"
    (loadMore)="loadMoreSuppliers()"
  ></app-dynamic-table>
</div>
