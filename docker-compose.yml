services:
  frontend:
    build:
      context: ./pos-frontend
      dockerfile: Dockerfile
      target: development
    container_name: projectpos-frontend
    ports:
      - "4200:4200"
    restart: unless-stopped
    volumes:
      - ./pos-frontend/src:/app/src
      - ./pos-frontend/angular.json:/app/angular.json
      - ./pos-frontend/proxy.conf.js:/app/proxy.conf.js
      - ./pos-frontend/tsconfig.json:/app/tsconfig.json
      - ./pos-frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./pos-frontend/package.json:/app/package.json
      - ./pos-frontend/tailwind.config.js:/app/tailwind.config.js
      - ./pos-frontend/postcss.config.js:/app/postcss.config.js
      - ./pos-frontend/public:/app/public
      - ./pos-frontend/src/assets:/app/src/assets
    environment:
      CHOKIDAR_USEPOLLING: '1'
      PROXY_TARGET: http://backend:3000
    command: npx ng serve --host 0.0.0.0 --poll 2000

  backend:
    build:
      context: ./pos-backend
      dockerfile: Dockerfile
      target: builder
    container_name: projectpos-backend
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./pos-backend/src:/app/src
      - ./pos-backend/nest-cli.json:/app/nest-cli.json
      - ./pos-backend/tsconfig.json:/app/tsconfig.json
    # Load all DB credentials & secrets from this file into the container
    env_file:
      - ./pos-backend/.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      CHOKIDAR_USEPOLLING: '1'
      FRONTEND_URL: http://localhost:4200
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: pos-uploads
      S3_PUBLIC_URL: http://localhost:9000
    depends_on:
      - minio
    command: npm run start:dev

  # ─── Local MySQL (available for local dev/testing; app connects to TiDB Cloud externally)
  db:
    image: mysql:8.4
    container_name: projectpos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pos_db
      MYSQL_USER: pos_user
      MYSQL_PASSWORD: pos_password
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./pos-backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: projectpos-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: always

  createbuckets:
    image: minio/mc
    container_name: projectpos-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb local/pos-uploads;
      /usr/bin/mc anonymous set public local/pos-uploads;
      exit 0;
      "

volumes:
  db-data:
  minio-data:
