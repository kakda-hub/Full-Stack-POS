# version: '3.9'

services:
  frontend:
    build:
      context: ./pos-frontend
      dockerfile: Dockerfile
    container_name: projectpos-frontend
    ports:
      - "4200:80"
    restart: always

  backend:
    build:
      context: ./pos-backend
      dockerfile: Dockerfile
    container_name: projectpos-backend
    ports:
      - "3000:3000"
    restart: always
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: pos_db
      JWT_SECRET: supersecretkey
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: pos-uploads
      S3_PUBLIC_URL: http://localhost:9000
    depends_on:
      - db
      - minio

  db:
    image: mysql:8
    container_name: projectpos-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pos_db
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./pos-backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  minio:
    image: minio/minio
    container_name: projectpos-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: always

  createbuckets:
    image: minio/mc
    container_name: projectpos-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb local/pos-uploads;
      /usr/bin/mc anonymous set public local/pos-uploads;
      exit 0;
      "

volumes:
  db-data:
  minio-data: