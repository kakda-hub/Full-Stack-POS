services:
  frontend:
    build:
      context: ./pos-frontend
      dockerfile: Dockerfile
    container_name: projectpos-frontend
    ports:
      - "4200:80"
    restart: always

  backend:
    build:
      context: ./pos-backend
      dockerfile: Dockerfile
    container_name: projectpos-backend
    ports:
      - "3000:3000"
    restart: always
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: pos_db
      JWT_SECRET: supersecretkey
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: projectpos-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pos_db
    ports:
      - "3306:3306" # remove if production
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data: